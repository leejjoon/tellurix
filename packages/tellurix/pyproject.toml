[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tellurix"
version = "0.2.0"
description = "Differentiable terrestrial telluric transmission for high-resolution spectra"
readme = "README.md"
license = "MIT AND LicenseRef-AER-MT-CKD"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "exojax==2.5.0",
  # Already in the lock via exojax; declared because record.py uses it directly.
  "h5py>=3.10,<4",
  "jax>=0.11,<0.12",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.11,<0.12"]
# Fetching ERA5 columns from ARCO-ERA5 (tellurix.era5.fetch_column).
era5 = ["aiohttp>=3.9,<4", "fsspec>=2024.2", "requests>=2.31,<3", "zarr>=2.18,<3"]

[project.scripts]
tellurix-download-data = "tellurix.download:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tellurix"]
