[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tellurix-igrins"
version = "0.2.0"
description = "IGRINS reduced-spectrum reader, night calibration and lamp-flat blaze for tellurix"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "tellurix>=0.2,<0.3",
  # Already in the lock via exojax; declared because igrins.py reads FITS directly.
  "astropy>=7,<8",
  "h5py>=3.10,<4",
  "jax>=0.11,<0.12",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
]

[tool.uv.sources]
tellurix = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tellurix_igrins"]
