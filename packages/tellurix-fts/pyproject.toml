[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tellurix-fts"
version = "0.2.0"
description = "Readers for Fourier-transform spectrometer atlases (Arcturus, NSO solar) for tellurix"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "tellurix>=0.2,<0.3",
  "astropy>=7,<8",
  "jax>=0.11,<0.12",
  "numpy>=2.0,<3",
]

[tool.uv.sources]
tellurix = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tellurix_fts"]
