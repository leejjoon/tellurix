# The workspace root, not a package. It installs the three packages under
# packages/ into one environment for the pipeline scripts, benchmarks and tests
# that live at the top of the repository.

[project]
name = "tellurix-workspace"
version = "0.2.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  # era5: the profile scripts fetch ERA5 columns.
  "tellurix[era5]",
  "tellurix-fts",
  "tellurix-igrins",
]

[project.optional-dependencies]
gpu = ["tellurix[gpu]"]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
tellurix = { workspace = true }
tellurix-fts = { workspace = true }
tellurix-igrins = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
  "packages/tellurix/tests",
  "packages/tellurix-fts/tests",
  "packages/tellurix-igrins/tests",
  "tests",
]
addopts = "-ra"
